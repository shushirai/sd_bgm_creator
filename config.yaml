# =========================================
# Integrated Config: Image + BGM
# Japan × Lo-fi Edition
# =========================================

# -----------------------------------------
# IMAGE CONFIG
# -----------------------------------------
image:
  common:
    model: "runwayml/stable-diffusion-v1-5"
    sampler: "DPM++ 2M Karras"
    steps: 50
    cfg_scale: 5.8
    width: 768 #1024
    height: 512 #768
    seed: -1
    batch_size: 1
    count: 5  # 生成する画像枚数（CLIで上書き可能）

 
  negative_prompt: >
    readable text,
    japanese text,
    kanji,
    subtitles,
    watermark,
    logo,
    street signs,
    billboard text,
    distorted letters,
    malformed typography,
    close-up signage,
    close-up face,
    portrait,
    anime,
    cartoon,
    oversaturated colors,
    blurry,
    low quality,
    distorted anatomy,
    extra limbs,
    bad hands



  presets:
    sakura_wet_snowy:
      description: "桜×夜×濡れ路面＋雪/みぞれ粒（幻想寄り）"
      prompt: >
        cinematic night street in Tokyo,
        wet asphalt reflections, light snowfall mixed with rain (sleet),
        cherry blossom tree sakura blooming, petals drifting,
        quiet street, minimal traffic, empty atmosphere,
        warm shop lights, subtle lantern light,
        low saturation, monochrome-ish but with soft pink blossoms,
        film grain, long exposure, atmospheric, realistic photo

    sakura_rain_street:
      description: "雨の夜×桜×日本の街角（低彩度／桜ピンク残し／路面反射）"
      prompt: >
        cinematic night street scene in Japan,
        rainy night, wet asphalt pavement with strong mirror-like reflections,
        massive cherry blossom tree (sakura) in full bloom dominating the scene,
        pink sakura petals falling in the rain,
        traditional wooden storefronts with lattice doors and windows,
        warm amber and coral neon lights reflecting on wet ground,
        dark blue and teal shadow tones, minimal lighting,
        misty rain streaks, bokeh light reflections,
        low saturation color palette with pink as the only vibrant hue,
        film noir aesthetic, 35mm film photography, soft film grain,
        long exposure effect, high contrast, moody atmosphere, ultra realistic, professional cinematography

    tokyo_dreamy_lofi_night:
      description: "夜の日本の幻想×ローファイ背景向け（霧＋ネオン＋低彩度）"
      prompt: >
        cinematic night alley in Tokyo, light fog and thin mist drifting, wet asphalt with mirror reflections,
        soft neon signs in cyan and amber, paper lantern glow, vending machine light spill,
        quiet empty street, minimal people, power lines overhead, subtle rain droplets, puddles,
        low saturation with gentle teal-orange contrast, shallow depth of field bokeh,
        film grain, 35mm long exposure, dreamy and moody atmosphere, realistic photo

    kyoto_tranquil_misty_night:
      description: "夜の京都：幻想的×静か×霧（行灯と町家の温灯り）"
      prompt: >
        misty night street in Kyoto, stone-paved alley lit by soft paper lanterns, traditional machiya with wooden lattice and glowing shoji windows,
        faint temple roofs and a vermilion torii glowing softly in the distance, gentle moonlight on tiled roofs,
        few silhouettes, humid air diffusing warm light, dreamy and tranquil mood,
        low saturation palette, soft contrast, cinematic, realistic photo

    japan_rainy_convenience_store:
      description: "海外で伸びやすい日本夜景 aesthetic（コンビニ＋雨＋孤独感）"
      prompt: >
        cinematic rainy night in Japan,
        quiet Tokyo side street,
        glowing Japanese convenience store,
        wet asphalt with mirror reflections,
        solitary person holding transparent umbrella seen from behind,
        vending machine glowing softly,
        light fog, humid air,
        subtle neon signs,
        power lines overhead,
        late night loneliness,
        peaceful atmosphere,
        low saturation cinematic colors,
        soft teal and amber tones,
        shallow depth of field,
        35mm film still,
        kodak portra,
        film grain,
        ultra realistic photo

    nostalgic_japan_train_crossing:
      description: "海外人気が非常に高い踏切 aesthetic"
      prompt: >
        nostalgic Japanese railroad crossing at night,
        light rain falling,
        wet reflective street,
        quiet suburban Japan,
        glowing crossing lights,
        small traditional houses,
        vending machine nearby,
        lone bicycle parked beside the road,
        warm window lights,
        misty atmosphere,
        melancholic mood,
        cinematic framing,
        realistic photography,
        low saturation,
        soft film grain,
        dreamy atmosphere,
        ultra realistic

    tokyo_lofi_window_view:
      description: "作業用LOFI系で超強い窓際 aesthetic"
      prompt: >
        cozy Tokyo apartment at night,
        rain on window glass,
        blurry neon city lights outside,
        warm desk lamp glow,
        japanese room interior,
        laptop on wooden desk,
        cup of coffee,
        calm atmosphere,
        relaxing late night mood,
        cinematic lighting,
        soft shadows,
        realistic photo,
        film grain,
        low saturation,
        peaceful ambience,
        shallow depth of field

    kyoto_rain_lantern_alley:
      description: "京都×雨×灯籠の癒し系"
      prompt: >
        rainy alley in Kyoto at night,
        glowing paper lanterns,
        traditional wooden machiya houses,
        wet stone pavement reflecting warm light,
        soft mist drifting through the alley,
        quiet peaceful atmosphere,
        lone traveler with umbrella,
        cinematic composition,
        realistic photography,
        low saturation color palette,
        warm amber lights,
        soft contrast,
        film grain,
        dreamy and healing atmosphere

    japanese_coastal_drive_lofi:
      description: "日本の海沿いドライブ aesthetic"
      prompt: >
        cinematic coastal road in Japan at dusk,
        ocean beside the road,
        japanese kei car driving slowly,
        cloudy sky after rain,
        wet asphalt reflections,
        utility poles along the coast,
        peaceful atmosphere,
        nostalgic summer mood,
        low saturation cinematic colors,
        dreamy lighting,
        film grain,
        realistic photography,
        calming scenery,
        relaxing vibe

# -----------------------------------------
# MUSICGEN CONFIG
# -----------------------------------------
musicgen:
  model: "facebook/musicgen-stereo-large"
  duration: 30  # 1セグメントの長さ（秒）

# -----------------------------------------
# GENERATION CONFIG
# -----------------------------------------

generation:
  prompt: >
    Japanese midnight drive ambient lo-fi for deep focus and long listening.

    Warm felt piano and soft Rhodes chords,
    deep gentle sub bass,
    subtle analog texture and soft vinyl hiss,
    restrained brushed percussion only.

    Slow and predictable rhythm,
    minimal instrumentation,
    sparse arrangement,
    lots of negative space,
    smooth evolving atmosphere.

    No vocals,
    no lead melody,
    no catchy hooks,
    no melodic solos,
    no bright highs,
    no aggressive percussion,
    no sharp transients,
    no sudden changes.

    Soft high frequencies,
    rolled-off top end,
    fatigue-free sound design,
    comfortable for multi-hour listening sessions.

    Designed for studying,
    reading,
    writing,
    programming,
    deep work,
    and late-night concentration.

    Emotionally subtle,
    calm and stable atmosphere,
    supportive harmony only,
    background-oriented mix.

    Inspired by quiet Japanese expressways at midnight,
    distant rain reflections,
    empty suburban roads,
    and peaceful urban solitude.

    Seamless loopable structure,
    warm analog ambience,
    hypnotic but unobtrusive,
    steady flow state energy.

    BPM 68-74.


  num_tracks: 10

  total_duration_sec: 5400   # 90分

  select_track: "auto"

  device: "auto"

  crossfade_ms: 2500

  fade_ms: 1200

  output_dir: "outputs"

  takes_dir: "outputs/_takes"

  final_dir: "outputs/_final"

  final_output: "tokyo_night_drive_lofi.wav"
# -----------------------------------------
# MUSIC PRESETS
# -----------------------------------------
music:
  presets:
    fireplace_reader:
      description: "薪暖炉×読書：温かく静かな癒し系Lo-fi（集中・リラックス・読書用）"
      prompt: >
        cozy lo-fi ambient background music for reading in a room with a fireplace,
        warm crackling fireplace atmosphere,
        soft piano and felt piano tones,
        gentle acoustic guitar harmonics,
        warm Rhodes chords,
        very soft brushed drums,
        60-70 bpm,
        deep warm low frequencies,
        soft vinyl crackle,
        subtle tape hiss,
        no vocals,
        no lead melody,
        no sharp transients,
        no bright highs,
        smooth looping structure,
        calm, intimate, peaceful,
        relaxing, comforting, cinematic warmth,
        perfect for reading, studying, late night focus, sleep preparation,
        non-distracting, emotional but minimal,
        warm analog texture, lo-fi, ambient, slow evolving

    deep_work_flow:
      description: "読書・勉強・仕事の作業用：集中を維持する穏やかなローファイ"
      prompt: >
        smooth lo-fi ambient background music for deep work and long study sessions,
        72-76 bpm steady and predictable rhythm,
        warm felt piano with gentle chord progressions,
        soft rhodes pads slowly evolving in the background,
        light brushed hi-hats and subtle rim clicks,
        warm sub bass with gentle sidechain breathing,
        soft vinyl crackle and tape hiss for analog warmth,
        wide stereo reverb creating spacious room feel,
        no vocals, no lead melody, no hooks, no drops,
        no bright highs, no sharp transients, no sudden changes,
        seamless looping structure with no noticeable repeats,
        consistent energy level throughout without builds or breakdowns,
        calm, focused, unobtrusive, steady concentration atmosphere,
        designed for reading, studying, coding, writing, office work,
        non-distracting background that enhances flow state,
        warm analog lo-fi texture, minimal and functional