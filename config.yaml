# =========================================
# Integrated Config: Image + BGM
# Japan × Lo-fi Edition
# =========================================

# -----------------------------------------
# IMAGE CONFIG
# -----------------------------------------
image:
  common:
    model: "runwayml/stable-diffusion-v1-5"
    sampler: "DPM++ 2M Karras"
    steps: 50
    cfg_scale: 5.8
    width: 768 #1024
    height: 512 #768
    seed: -1
    batch_size: 1
    count: 5  # 生成する画像枚数（CLIで上書き可能）

 
  negative_prompt: >
    readable text,
    japanese text,
    kanji,
    subtitles,
    watermark,
    logo,
    street signs,
    billboard text,
    distorted letters,
    malformed typography,
    close-up signage,
    close-up face,
    portrait,
    anime,
    cartoon,
    oversaturated colors,
    blurry,
    low quality,
    distorted anatomy,
    extra limbs,
    bad hands



  presets:
    sakura_wet_snowy:
      description: "桜×夜×濡れ路面＋雪/みぞれ粒（幻想寄り）"
      prompt: >
        cinematic night street in Tokyo,
        wet asphalt reflections, light snowfall mixed with rain (sleet),
        cherry blossom tree sakura blooming, petals drifting,
        quiet street, minimal traffic, empty atmosphere,
        warm shop lights, subtle lantern light,
        low saturation, monochrome-ish but with soft pink blossoms,
        film grain, long exposure, atmospheric, realistic photo

    sakura_rain_street:
      description: "雨の夜×桜×日本の街角（低彩度／桜ピンク残し／路面反射）"
      prompt: >
        cinematic night street scene in Japan,
        rainy night, wet asphalt pavement with strong mirror-like reflections,
        massive cherry blossom tree (sakura) in full bloom dominating the scene,
        pink sakura petals falling in the rain,
        traditional wooden storefronts with lattice doors and windows,
        warm amber and coral neon lights reflecting on wet ground,
        dark blue and teal shadow tones, minimal lighting,
        misty rain streaks, bokeh light reflections,
        low saturation color palette with pink as the only vibrant hue,
        film noir aesthetic, 35mm film photography, soft film grain,
        long exposure effect, high contrast, moody atmosphere, ultra realistic, professional cinematography

    tokyo_dreamy_lofi_night:
      description: "夜の日本の幻想×ローファイ背景向け（霧＋ネオン＋低彩度）"
      prompt: >
        cinematic night alley in Tokyo, light fog and thin mist drifting, wet asphalt with mirror reflections,
        soft neon signs in cyan and amber, paper lantern glow, vending machine light spill,
        quiet empty street, minimal people, power lines overhead, subtle rain droplets, puddles,
        low saturation with gentle teal-orange contrast, shallow depth of field bokeh,
        film grain, 35mm long exposure, dreamy and moody atmosphere, realistic photo

    kyoto_tranquil_misty_night:
      description: "夜の京都：幻想的×静か×霧（行灯と町家の温灯り）"
      prompt: >
        misty night street in Kyoto, stone-paved alley lit by soft paper lanterns, traditional machiya with wooden lattice and glowing shoji windows,
        faint temple roofs and a vermilion torii glowing softly in the distance, gentle moonlight on tiled roofs,
        few silhouettes, humid air diffusing warm light, dreamy and tranquil mood,
        low saturation palette, soft contrast, cinematic, realistic photo

    japan_rainy_convenience_store:
      description: "海外で伸びやすい日本夜景 aesthetic（コンビニ＋雨＋孤独感）"
      prompt: >
        cinematic rainy night in Japan,
        quiet Tokyo side street,
        glowing Japanese convenience store,
        wet asphalt with mirror reflections,
        solitary person holding transparent umbrella seen from behind,
        vending machine glowing softly,
        light fog, humid air,
        subtle neon signs,
        power lines overhead,
        late night loneliness,
        peaceful atmosphere,
        low saturation cinematic colors,
        soft teal and amber tones,
        shallow depth of field,
        35mm film still,
        kodak portra,
        film grain,
        ultra realistic photo

    nostalgic_japan_train_crossing:
      description: "海外人気が非常に高い踏切 aesthetic"
      prompt: >
        nostalgic Japanese railroad crossing at night,
        light rain falling,
        wet reflective street,
        quiet suburban Japan,
        glowing crossing lights,
        small traditional houses,
        vending machine nearby,
        lone bicycle parked beside the road,
        warm window lights,
        misty atmosphere,
        melancholic mood,
        cinematic framing,
        realistic photography,
        low saturation,
        soft film grain,
        dreamy atmosphere,
        ultra realistic

    tokyo_lofi_window_view:
      description: "作業用LOFI系で超強い窓際 aesthetic"
      prompt: >
        cozy Tokyo apartment at night,
        rain on window glass,
        blurry neon city lights outside,
        warm desk lamp glow,
        japanese room interior,
        laptop on wooden desk,
        cup of coffee,
        calm atmosphere,
        relaxing late night mood,
        cinematic lighting,
        soft shadows,
        realistic photo,
        film grain,
        low saturation,
        peaceful ambience,
        shallow depth of field


  tokyo_rain_no_text:
    description: "漢字なしで“夜の東京”を感じる cinematic aesthetic"

    prompt: >
      cinematic rainy night in Tokyo,
      quiet urban side street,
      wet asphalt with mirror reflections,
      glowing convenience store light without visible text,
      vending machine glow with blurred details,
      warm apartment windows,
      elevated train tracks overhead,
      narrow alleyways,
      power lines crossing the sky,
      soft neon lighting without readable signs,
      humid air and drifting mist,
      lone figure with transparent umbrella seen from behind,
      parked bicycles,
      distant car headlights through rain,
      shallow depth of field,
      strong bokeh lights,
      low saturation cinematic colors,
      teal and amber color grading,
      peaceful loneliness,
      healing atmosphere,
      late night Tokyo ambience,
      realistic photography,
      35mm film still,
      kodak portra 400,
      film grain,
      ultra realistic

    negative_prompt: >
      readable text,
      japanese text,
      kanji,
      hiragana,
      katakana,
      subtitles,
      logo,
      watermark,
      billboard,
      signboard,
      street signs,
      close-up signage,
      anime,
      cartoon,
      illustration,
      oversaturated colors,
      bright daylight,
      close-up face,
      portrait,
      distorted anatomy,
      extra limbs,
      bad hands,
      blurry low quality

# -----------------------------------------
# MUSIC GENERATION BACKEND CONFIG
# -----------------------------------------
# model_type: "musicgen" | "acestep"
# -----------------------------------------
# [Migration note]
#   旧: facebook/musicgen-stereo-large  (CC-BY-NC 4.0 → 商用不可)
#   新: ACE-Step/ACE-Step-v1-3.5B       (Apache 2.0  → 商用OK / YouTube収益化対応)
# -----------------------------------------
musicgen:
  model_type: "acestep"

  # --- ACE-Step v1.0（現在・動作確認済み） ---
  # Apache 2.0 / 最大240秒 / Mac MPS 対応
  model: "ACE-Step/ACE-Step-v1-3.5B"
  duration: 240           # 1セグメントの長さ（秒）。最大240（4分）
  infer_step: 60          # v1.0: 品質優先は60。速度優先は27
  guidance_scale: 15.0    # プロンプト追従強度。7〜20推奨
  scheduler_type: "euler" # euler | dpmpp-3m-sde
  cfg_type: "apg"         # apg | cfg
  bf16: false             # Mac(MPS)はfalse必須。Linux(CUDA)はtrueで高速化

  # --- ACE-Step v1.5（アップグレード推奨・スコア+37%） ---
  # MIT License / LM+DiT新アーキテクチャ / 10分曲対応 / 50+言語
  # アップグレード手順:
  #   1. git clone https://github.com/ace-step/ACE-Step-1.5.git vendor/ace-step-1.5
  #   2. pip install -e vendor/ace-step-1.5
  #   3. model: "ACE-Step/Ace-Step1.5"
  # model: "ACE-Step/Ace-Step1.5"
  # duration: 240
  # infer_step: 50

  # --- MusicGen (旧・非商用のみ) ---
  # model_type: "musicgen"
  # model: "facebook/musicgen-stereo-large"
  # duration: 25

# -----------------------------------------
# GENERATION CONFIG
# -----------------------------------------

generation:
  prompt: >
    lo-fi, ambient, instrumental,
    felt piano, Rhodes pads, soft upright bass, brushed drums,
    vinyl crackle, tape hiss, analog warmth,
    70 bpm, slow groove,
    late night Tokyo, midnight drive, rain reflections, urban solitude,
    calm, focused, nostalgic, peaceful,
    study music, deep work, background music,
    seamless loop, long listening session


  num_tracks: 15

  total_duration_sec: 7200   # 120分

  select_track: "auto"

  device: "auto"

  crossfade_ms: 2500

  fade_ms: 1200

  output_dir: "outputs"

  takes_dir: "outputs/_takes"

  final_dir: "outputs/_final"

  final_output: "tokyo_night_drive_lofi.wav"
# -----------------------------------------
# MUSIC PRESETS
# -----------------------------------------
